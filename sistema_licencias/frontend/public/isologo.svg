<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="baraderoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008ecc" />
      <stop offset="100%" stop-color="#005a96" />
    </linearGradient>
    <linearGradient id="baraderoGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3aae1f" />
      <stop offset="100%" stop-color="#2d8c16" />
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="isologo-baradero-content">
    <!-- Texto Superior: MUNICIPIO DE (Fuente Gautami / Sans-Serif Limpia) -->
    <text x="310" y="44" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="19" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#333333" 
          class="brand-text-municipio"
          text-anchor="middle">MUNICIPIO DE</text>

    <!-- Texto Principal: BARADERO (Fuente Humanist 777 Black / Heavy Display) -->
    <text x="250" y="88" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="-0.5" 
          fill="#333333" 
          class="brand-text-baradero"
          text-anchor="middle">BARADERO</text>

    <!-- Curva Azul Superior (Pantone 7461 C / #007CBA) -->
    <path d="M 40 108 
             C 120 84, 210 92, 330 105 
             C 390 111, 435 106, 465 92 
             C 435 116, 370 128, 305 125 
             C 215 122, 140 135, 40 108 Z" 
          fill="url(#baraderoBlueGrad)" 
          filter="url(#subtleShadow)" />

    <!-- Curva Verde Inferior (Pantone 361 C / #3AAE1F) -->
    <path d="M 120 120 
             C 195 114, 280 118, 385 110 
             C 425 107, 455 100, 470 94 
             C 450 114, 400 124, 340 126 
             C 255 129, 185 133, 120 120 Z" 
          fill="url(#baraderoGreenGrad)" />
  </g>
</svg>
